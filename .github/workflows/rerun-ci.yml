name: Rerun CI

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Failed workflow run ID to retry
        type: string
        required: true

permissions:
  actions: write
  contents: read

jobs:
  rerun-failed-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun failed jobs on demand
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run-id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run rerun "$RUN_ID" --failed

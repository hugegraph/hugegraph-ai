name: Code Quality (Ruff + ty)

on:
  workflow_call:
    inputs:
      uv-version:
        type: string
        required: true
      ruff-version:
        type: string
        required: true
      ty-version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: quality
      - name: Format and lint without installing runtime dependencies
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          uvx --from "ruff==$RUFF_VERSION" ruff format --check .
          uvx --from "ruff==$RUFF_VERSION" ruff check .
      - name: Type check release and CI tooling
        env:
          TY_VERSION: ${{ inputs.ty-version }}
        run: uvx --from "ty==$TY_VERSION" ty check --python-version 3.11 --extra-search-path scripts scripts

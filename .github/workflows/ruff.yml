name: Code Quality (Ruff + ty)

on:
  workflow_call:
    inputs:
      uv-version:
        type: string
        required: true
      ruff-version:
        type: string
        required: true
      ty-version:
        type: string
        required: true
      python-version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        id: python-env
        with:
          uv-version: ${{ inputs.uv-version }}
          python-version: ${{ inputs.python-version }}
          component: quality
      - name: Format and lint without installing runtime dependencies
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: |
          uvx --from "ruff>=$RUFF_VERSION" ruff format --check .
          uvx --from "ruff>=$RUFF_VERSION" ruff check .
      - name: Type check release and CI tooling
        env:
          TY_VERSION: ${{ inputs.ty-version }}
        run: uvx --from "ty>=$TY_VERSION" ty check --python-version 3.12 --extra-search-path scripts scripts
      - name: Prune uv cache before upload
        if: always() && steps.python-env.outcome == 'success'
        run: uv cache prune --ci

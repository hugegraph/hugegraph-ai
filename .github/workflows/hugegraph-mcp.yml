name: HugeGraph-MCP CI

on:
  workflow_call:
    inputs:
      python-versions:
        type: string
        required: true
      integration-python:
        type: string
        required: true
      uv-version:
        type: string
        required: true
      ty-version:
        type: string
        required: true
      server-image:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  tests:
    name: mcp / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    services:
      hugegraph:
        image: ${{ matrix.python-version == inputs.integration-python && inputs.server-image || '' }}
        env:
          PASSWORD: admin
        options: >-
          --health-cmd="curl -f http://localhost:8080/versions || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=12 --health-start-period=90s
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ inputs.uv-version }}
          component: mcp
      - name: Install standalone MCP and test dependencies
        run: |
          uv venv .venv-mcp
          uv --no-config pip install --python .venv-mcp/bin/python \
            -e ./hugegraph-python-client -e ./hugegraph-mcp "pytest~=8.0.0"
      - name: Run MCP tests
        run: .venv-mcp/bin/python -m pytest hugegraph-mcp -m "not live and not integration and not llm"
      - name: Type check MCP (advisory while existing diagnostics are resolved)
        if: matrix.python-version == inputs.integration-python
        continue-on-error: true
        env:
          TY_VERSION: ${{ inputs.ty-version }}
        run: uvx --from "ty==$TY_VERSION" ty check --python .venv-mcp/bin/python hugegraph-mcp/hugegraph_mcp
      - name: Verify wheel and sdist installation
        if: matrix.python-version == inputs.integration-python
        run: |
          uv build --no-sources --out-dir wheelhouse hugegraph-python-client
          uv build --no-sources --out-dir wheelhouse hugegraph-mcp
          for format in whl tar.gz; do
            uv venv --clear isolated-mcp-venv
            uv --no-config pip install --python isolated-mcp-venv/bin/python \
              wheelhouse/hugegraph_python-*.$format wheelhouse/hugegraph_mcp-*.$format
            EXPECTED_VERSION="${{ inputs.version }}" isolated-mcp-venv/bin/python - <<'PYTHON'
          import os
          from importlib.metadata import requires, version
          from packaging.requirements import Requirement
          import hugegraph_mcp
          import pyhugegraph
          expected = os.environ['EXPECTED_VERSION']
          assert version('hugegraph-python') == expected
          assert version('hugegraph-mcp') == expected
          dependency = next(Requirement(value) for value in requires('hugegraph-mcp') if Requirement(value).name == 'hugegraph-python')
          assert expected in dependency.specifier
          PYTHON
          done
      - name: Verify uvx distribution startup
        if: matrix.python-version == inputs.integration-python
        env:
          EXPECTED_MCP_VERSION: ${{ inputs.version }}
        run: |
          .venv-mcp/bin/python hugegraph-mcp/tests/distribution_smoke.py -- \
            uvx --no-config --no-cache --python "${{ matrix.python-version }}" \
            --index-url https://pypi.org/simple \
            --with "$(realpath wheelhouse/hugegraph_python-*.whl)" \
            --from "$(realpath wheelhouse/hugegraph_mcp-*.whl)" hugegraph-mcp
      - name: Verify HugeGraph image and version
        if: matrix.python-version == inputs.integration-python
        env:
          EXPECTED_SERVER_VERSION: ${{ inputs.version }}
          HUGEGRAPH_CONTAINER_ID: ${{ job.services.hugegraph.id }}
        run: bash scripts/check_hugegraph.sh "$EXPECTED_SERVER_VERSION" "$HUGEGRAPH_CONTAINER_ID"
      - name: Run real HugeGraph write-path tests
        if: matrix.python-version == inputs.integration-python
        working-directory: hugegraph-mcp
        env:
          RUN_MCP_REAL_HUGEGRAPH_TESTS: '1'
          HUGEGRAPH_URL: http://127.0.0.1:8080
          HUGEGRAPH_GRAPH_PATH: DEFAULT/hugegraph
          HUGEGRAPH_USER: admin
          HUGEGRAPH_PASSWORD: admin
          HUGEGRAPH_MCP_READONLY: 'false'
          HUGEGRAPH_MCP_ALLOW_AI: 'false'
        run: ../.venv-mcp/bin/python -m pytest tests/integration/test_real_write_path.py -m real_hugegraph
      - name: Dump HugeGraph diagnostics
        if: failure() && matrix.python-version == inputs.integration-python
        run: |
          docker ps -a
          docker logs "${{ job.services.hugegraph.id }}"

name: PR 87 layout validation source
on:
  push:
    branches: [chore/pr87-layout-check-20261108]
    paths: [.github/workflows/pr87-layout-source.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Remove only temporary branches created for this migration
        run: |
          test "$(git ls-remote origin refs/heads/feat/eval-sdk | cut -f1)" = 50e3ce128f3689fabadb9a8fe8aacbca4f98f922
          test "$(git ls-remote origin refs/heads/chore/pr87-layout-result-20261108 | cut -f1)" = d7bbe3df316c97298449e78aa191e001739e189b
          test "$(git ls-remote origin refs/heads/chore/pr87-layout-check-20261108 | cut -f1)" = "$GITHUB_SHA"
          git push origin --delete chore/pr87-layout-result-20261108 chore/pr87-layout-check-20261108

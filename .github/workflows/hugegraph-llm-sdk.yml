name: HugeGraph-LLM SDK CI

on:
  push:
    branches:
      - 'main'
      - 'release-*'
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.9.22"
  PYTHONDONTWRITEBYTECODE: "1"
  SKIP_EXTERNAL_SERVICES: "true"
  HUGEGRAPH_LLM_SDK_TEST_INSTALLED: "1"

jobs:
  independent-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build outside the application workspace
        run: |
          cp -R "$GITHUB_WORKSPACE/hugegraph-llm-sdk" "$RUNNER_TEMP/sdk-build"
          cd "$RUNNER_TEMP"
          uv build --no-sources "$RUNNER_TEMP/sdk-build" --out-dir "$RUNNER_TEMP/sdk-dist"
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/sdk-venv"
          uv pip install --python "$RUNNER_TEMP/sdk-venv/bin/python" "$RUNNER_TEMP"/sdk-dist/*.whl "pytest>=8,<9"
      - name: Verify isolated installation and offline examples
        env:
          PYTHONPATH: ""
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdk-venv/bin/python" -B "$RUNNER_TEMP/sdk-build/tests/distribution_smoke.py"
          "$RUNNER_TEMP/sdk-venv/bin/python" -B "$RUNNER_TEMP/sdk-build/examples/basic.py"
          "$RUNNER_TEMP/sdk-venv/bin/python" -B "$RUNNER_TEMP/sdk-build/examples/customization.py"
          "$RUNNER_TEMP/sdk-venv/bin/python" -B "$RUNNER_TEMP/sdk-build/examples/async_example.py"
      - name: Run SDK contracts against the installed wheel
        env:
          PYTHONPATH: ""
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdk-venv/bin/python" -m pytest "$RUNNER_TEMP/sdk-build/tests" -q --tb=short

  provider-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install optional provider adapters from the wheel
        run: |
          cp -R "$GITHUB_WORKSPACE/hugegraph-llm-sdk" "$RUNNER_TEMP/sdk-build"
          cd "$RUNNER_TEMP"
          uv build --no-sources "$RUNNER_TEMP/sdk-build" --out-dir "$RUNNER_TEMP/sdk-dist"
          uv venv --python 3.11 "$RUNNER_TEMP/sdk-venv"
          sdk_wheels=("$RUNNER_TEMP"/sdk-dist/*.whl)
          uv pip install --python "$RUNNER_TEMP/sdk-venv/bin/python" "${sdk_wheels[0]}[openai,ollama,litellm]" "pytest>=8,<9"
      - name: Test provider contracts without external requests
        env:
          PYTHONPATH: ""
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdk-venv/bin/python" -m pytest "$RUNNER_TEMP/sdk-build/tests/test_providers.py" -q --tb=short

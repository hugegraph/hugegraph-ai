name: "PR 89 backend review fixes"

on:
  push:
    branches:
      - "codex/pr89-ontology-review-fixes"
    paths:
      - ".github/scripts/pr89_backend_fix.py.gz.b64"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply reviewed backend patch
        run: |
          base64 -d .github/scripts/pr89_backend_fix.py.gz.b64 | gzip -dc > .github/scripts/pr89_backend_fix.py
          python .github/scripts/pr89_backend_fix.py
      - name: Install backend verification environment
        working-directory: ontogeny
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[mcp]' pytest pytest-asyncio httpx ruff
      - name: Normalize and verify changed Python files
        working-directory: ontogeny
        run: |
          changed=(
            server/ontogeny/auth/service.py
            server/ontogeny/functions/sandbox.py
            server/ontogeny/api/routes_objects.py
            server/ontogeny/core/validator.py
            server/ontogeny/agent/broker.py
            server/ontogeny/api/routes_agent.py
            server/ontogeny/mcp_server.py
            server/ontogeny/builder_ops.py
            tests/test_auth_identity.py
            tests/test_security_regressions.py
            tests/test_agent.py
            tests/test_builder.py
          )
          .venv/bin/ruff check --fix "${changed[@]}"
          .venv/bin/ruff format "${changed[@]}"
          .venv/bin/ruff check server tests
          .venv/bin/ruff format --check server tests
          git diff --check
      - name: Backend tests
        working-directory: ontogeny
        run: .venv/bin/pytest -q
      - name: Commit verified backend fixes
        run: |
          rm -f .github/scripts/pr89_backend_fix.py.gz.b64
          rm -f .github/scripts/pr89_backend_fix.py
          rm -f .github/workflows/pr89-backend-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ontogeny): harden backend security boundaries"
          git push origin HEAD:codex/pr89-ontology-review-fixes
